<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 协作工作台</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e6e8ec; --line2:#eef0f3;
  --ink:#111827; --ink2:#4b5563; --ink3:#9aa1ad;
  --brand:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-size:13px;line-height:1.55;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}

/* ---------- 侧栏 ---------- */
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:16px 16px 14px}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-size:14px;font-weight:600;letter-spacing:.2px;display:block;line-height:1.2}
.brand span{font-size:11px;color:var(--ink3)}
.sec{padding:0 10px;margin-top:6px}
.sec-title{font-size:11px;color:var(--ink3);padding:8px 8px 6px;letter-spacing:.4px;font-weight:500}
.mlist{display:flex;flex-direction:column;gap:2px}
.mitem{
  display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;
  cursor:pointer;border:1px solid transparent;transition:background .12s;
}
.mitem:hover{background:#f6f7f9}
.mitem.sel{background:#eff4ff;border-color:#dbe4ff}
.mitem .lg{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;background:#f3f4f6}
.mitem .lg svg{width:20px;height:20px}
.mitem .tx{min-width:0;flex:1}
.mitem .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .rl{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink3)}
.mitem .dot.on{background:var(--ok)}
.mitem .dot.warn{background:var(--warn)}
.mitem .dot.off{background:var(--ink3)}

.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line2);font-size:11px;color:var(--ink3);line-height:1.7}
.side-foot b{color:var(--ink2);font-weight:500}

/* ---------- 主区 ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{
  display:flex;align-items:center;gap:14px;padding:0 24px;height:56px;flex:none;
  background:#fff;border-bottom:1px solid var(--line);
}
.topbar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
.topbar .sub{font-size:11.5px;color:var(--ink3)}
.topbar .sp{flex:1}
.search{
  display:flex;align-items:center;gap:7px;background:#f6f7f9;border:1px solid var(--line);
  border-radius:8px;padding:0 10px;height:32px;width:220px;
}
.search input{border:0;background:transparent;outline:none;font-size:12.5px;color:var(--ink);width:100%;font-family:inherit}
.search svg{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2;flex:none}
.btn{
  height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-size:12.5px;cursor:pointer;font-family:inherit;
}
.btn:hover{background:#f6f7f9;border-color:#d8dbe2}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1d4ed8}

.content{flex:1;overflow:auto;padding:18px 24px 28px;min-height:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.kpi .k{font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.kpi .v{font-size:21px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
.kpi .v small{font-size:12px;font-weight:400;color:var(--ink3);margin-left:3px}
.kpi .t{font-size:11px;color:var(--ink3);margin-top:3px}

.row2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card > h2{font-size:12.5px;font-weight:600;margin:0 0 12px;color:var(--ink2);letter-spacing:.2px}

/* 成员工作台 */
.ws-head{display:flex;align-items:flex-start;gap:13px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.ws-head .lg{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;flex:none;border:1px solid var(--line2)}
.ws-head .lg svg{width:34px;height:34px}
.ws-head .nm{font-size:16.5px;font-weight:600;line-height:1.25}
.ws-head .en{font-size:12px;color:var(--ink2);margin-top:1px}
.ws-head .vr{font-size:11px;color:var(--ink3);font-family:ui-monospace,Consolas,monospace;margin-top:1px}
.pill{
  font-size:11px;padding:2px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;
  border:1px solid transparent;white-space:nowrap;
}
.pill.on{background:#eefaf1;color:#15803d;border-color:#cdeed8}
.pill.off{background:#fef2f2;color:#b91c1c;border-color:#fbd5d5}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line2)}
.metric .k{font-size:11px;color:var(--ink3);margin-bottom:3px}
.metric .v{font-size:13px;color:var(--ink);word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:13px 0 0}
.tag{font-size:11.5px;padding:3px 9px;border-radius:6px;background:#f3f4f6;color:#374151;border:1px solid #e8eaee}
.warnbar{
  display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:9px 11px;border-radius:8px;
  background:#fffbeb;border:1px solid #fde9bf;color:#92400e;font-size:12px;
}
.warnbar svg{width:14px;height:14px;flex:none;margin-top:2px;stroke:#d97706;fill:none;stroke-width:2}
.cmdbox{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cmdbox .hd{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#fafbfc;border-bottom:1px solid var(--line2);font-size:11px;color:var(--ink3)}
.cmdbox pre{margin:0;padding:10px 12px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#334155;white-space:pre-wrap;word-break:break-all;background:#fff;line-height:1.6}
.copy{font-size:11px;color:var(--brand);cursor:pointer;background:none;border:0;font-family:inherit;padding:0}

/* 最近记录 */
.recent{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.recent .rt{font-size:11px;color:var(--ink3);margin-bottom:7px}
.rrow{display:flex;gap:9px;align-items:baseline;padding:3px 0;font-size:12px}
.rrow .rt2{color:var(--ink3);font-family:ui-monospace,Consolas,monospace;font-size:11px;flex:none;width:40px}
.rrow .rm{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 成本参考 */
.costs{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.costs .ct{font-size:11px;color:var(--ink3);margin-bottom:7px}
.crow{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.crow span:first-child{color:var(--ink2)}
.crow span:last-child{color:var(--ink);font-family:ui-monospace,Consolas,monospace;font-size:11.5px}

/* 路由 */
.routes{display:flex;flex-direction:column}
.route{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line2)}
.route:last-child{border-bottom:0}
.route .ic{width:7px;height:7px;border-radius:2px;background:#c7d2fe;flex:none}
.route .w{flex:1;color:var(--ink2);font-size:12.5px}
.route .to{font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.arw{color:var(--ink3);font-size:12px}

/* 活动流 */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--ink3);font-weight:500;padding:0 10px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfc}
td.t{color:var(--ink3);font-family:ui-monospace,Consolas,monospace;font-size:11.5px;white-space:nowrap;width:56px}
td.w{width:64px;color:var(--ink2)}
td.s{width:66px}
.mini{font-size:11px;padding:1px 7px;border-radius:5px;display:inline-block}
.mini.ok{background:#eefaf1;color:#15803d}
.mini.bad{background:#fef2f2;color:#b91c1c}

.empty{padding:26px;text-align:center;color:var(--ink3);font-size:12.5px}

@media (max-width:1120px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .row2{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .mlist{flex-direction:row;overflow:auto;gap:6px}
  .mitem{flex:none}
  .side-foot{display:none}
  .search{display:none}
  .metrics{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#2563eb"/><path d="M5.6 8.2l2.7 8 3.7-5.9 3.7 5.9 2.7-8" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>AI 协作工作台</b><span>团队运营中心</span></div>
    </div>
    <div class="sec">
      <div class="sec-title">团队成员</div>
      <div class="mlist" id="mlist"></div>
    </div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>团队总览</h1>
        <div class="sub" id="subline">数据加载中…</div>
      </div>
      <div class="sp"></div>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="搜索成员或事件">
      </label>
      <button class="btn" onclick="location.reload()">刷新数据</button>
    </div>

    <div class="content">
      <div class="kpis" id="kpis"></div>

      <div class="row2">
        <section class="card" id="workspace"></section>
        <section class="card">
          <h2>派活路由</h2>
          <div class="routes" id="routes"></div>
        </section>
      </div>

      <section class="card">
        <h2>活动流</h2>
        <table>
          <thead><tr><th>时间</th><th>成员</th><th>事件</th><th>结果</th></tr></thead>
          <tbody id="feed"></tbody>
        </table>
      </section>
    </div>
  </div>
</div>

<script src="assets/logos.js"></script>
<script src="data/office.js"></script>
<script>
const O = window.OFFICE || {agents:[], routing:[], log:[]};
const L = window.LOGOS || {};
const TINT = { wb:'#eff4ff', openai:'#f5f5f4', deepseek:'#eef2ff', claude:'#fdf3ee', doubao:'#eff6ff' };
const INK  = { wb:'#2563eb', openai:'#0f172a', deepseek:'#4d6bfe', claude:'#d97757', doubao:'#1e37fc' };

const byId = {};
O.agents.forEach(a => byId[a.id] = a);
let sel = O.agents[0] ? O.agents[0].id : null;
let filter = '';

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const logoOf = a => L[a.logo] || L.wb;

/* ---------- 侧栏成员 ---------- */
function renderMembers(){
  document.getElementById('mlist').innerHTML = O.agents.map(a => {
    const st = a.status === 'online' ? 'on' : (a.status === 'warn' ? 'warn' : 'off');
    return `<div class="mitem ${a.id===sel?'sel':''}" data-id="${a.id}">
      <div class="lg" style="background:${TINT[a.logo]||'#f3f4f6'};color:${INK[a.logo]||'#111'}">${logoOf(a)}</div>
      <div class="tx"><div class="nm">${esc(a.name)}</div><div class="rl">${esc(a.role)}</div></div>
      <i class="dot ${st}"></i>
    </div>`;
  }).join('');
  document.querySelectorAll('.mitem').forEach(el => {
    el.onclick = () => { sel = el.dataset.id; render(all()); };
  });
}

/* ---------- KPI ---------- */
function renderKpis(){
  const on = O.agents.filter(a => a.status === 'online').length;
  const ms = O.agents.map(a => a.ms).filter(x => typeof x === 'number' && x > 0);
  const avg = ms.length ? Math.round(ms.reduce((a,b)=>a+b,0)/ms.length) : null;
  const logs = O.log || [];
  const bad = logs.filter(l => l.bad).length;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="k">在线成员</div><div class="v">${on}<small>/ ${O.agents.length}</small></div>
      <div class="t">${on===O.agents.length?'全部在线，可随时派活':(O.agents.length-on)+' 个离线'}</div></div>
    <div class="kpi"><div class="k">平均探活</div><div class="v">${avg!=null?avg:'—'}<small>ms</small></div>
      <div class="t">最近一次检测</div></div>
    <div class="kpi"><div class="k">活动记录</div><div class="v">${logs.length}<small>条</small></div>
      <div class="t">${bad?bad+' 条异常':'无异常'}</div></div>
    <div class="kpi"><div class="k">调用方式</div><div class="v" style="font-size:16px">${esc((O.cost&&O.cost.mode)||'按量计费')}</div>
      <div class="t">${esc((O.cost&&O.cost.note)||'探活本身免费')}</div></div>`;
}

/* ---------- 工作台 ---------- */
function renderWorkspace(){
  const a = byId[sel] || O.agents[0];
  if (!a) { document.getElementById('workspace').innerHTML = '<div class="empty">没有成员数据</div>'; return; }
  const on = a.status === 'online';
  const msTxt = typeof a.ms === 'number' && a.ms > 0 ? a.ms + ' ms' : '—';
  document.getElementById('workspace').innerHTML = `
    <div class="ws-head">
      <div class="lg" style="background:${TINT[a.logo]||'#f3f4f6'};color:${INK[a.logo]||'#111'}">${logoOf(a)}</div>
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(a.name)}</div>
        <div class="en">${esc(a.engine)} · ${esc(a.role)}</div>
        <div class="vr">${esc(a.version)}</div>
      </div>
      <span class="pill ${on?'on':'off'}"><i class="d"></i>${on?'在线':'离线'}</span>
    </div>
    <div class="metrics">
      <div class="metric"><div class="k">最近活动</div><div class="v">${esc(a.last||'—')}</div></div>
      <div class="metric"><div class="k">探活耗时</div><div class="v">${msTxt}</div></div>
      <div class="metric"><div class="k">典型耗时</div><div class="v">${esc(a.latency||'—')}</div></div>
    </div>
    <div class="tags">${(a.caps||[]).map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>
    ${a.limit?`<div class="warnbar">
      <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18h20L13.7 3.9a2 2 0 00-3.4 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>能力边界</b>　${esc(a.limit)}</div></div>`:''}
    ${a.cmd?`<div class="cmdbox">
      <div class="hd"><span>调用方式</span><button class="copy" onclick="copyCmd(this)">复制</button></div>
      <pre id="cmdText">${esc(a.cmd)}</pre></div>`:''}
    ${(() => {
      const rs = (O.log || []).filter(l => l.who === a.name).slice(0, 3);
      return rs.length ? `<div class="recent"><div class="rt">该成员最近记录</div>
        ${rs.map(l => `<div class="rrow"><span class="rt2">${esc(l.t)}</span><span class="rm">${esc(l.msg)}</span></div>`).join('')}
      </div>` : '';
    })()}`;
}

function copyCmd(btn){
  const t = document.getElementById('cmdText');
  const s = t ? t.textContent : '';
  const done = () => { btn.textContent = '已复制'; setTimeout(()=>btn.textContent='复制', 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const r = document.createRange(); r.selectNodeContents(t);
    const sel2 = window.getSelection(); sel2.removeAllRanges(); sel2.addRange(r);
    try { document.execCommand('copy'); done(); } catch(e){ btn.textContent='复制失败'; }
  }
}

/* ---------- 路由 ---------- */
function renderRoutes(){
  const c = O.cost || {};
  const rows = [['普通问答', c.chat], ['联网一次', c.web], ['代码任务', c.code], ['月免费额度', c.free]]
    .filter(r => r[1]);
  document.getElementById('routes').innerHTML =
    (O.routing||[]).map(r =>
      `<div class="route"><i class="ic"></i><span class="w">${esc(r.when)}</span><span class="arw">→</span><span class="to">${esc(r.to)}</span></div>`
    ).join('') +
    (rows.length ? `<div class="costs"><div class="ct">成本参考</div>
      ${rows.map(([k,v]) => `<div class="crow"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}
    </div>` : '');
}

/* ---------- 活动流 ---------- */
function renderFeed(){
  const rows = (O.log||[]).filter(l =>
    !filter || (l.who+' '+l.msg).toLowerCase().includes(filter)
  );
  document.getElementById('feed').innerHTML = rows.length ? rows.map(l => `
    <tr>
      <td class="t">${esc(l.t)}</td>
      <td class="w">${esc(l.who)}</td>
      <td>${esc(l.msg)}</td>
      <td class="s"><span class="mini ${l.bad?'bad':'ok'}">${l.bad?'异常':'正常'}</span></td>
    </tr>`).join('') : `<tr><td colspan="4"><div class="empty">没有匹配的记录</div></td></tr>`;
}

/* ---------- 页脚信息 ---------- */
function renderChrome(){
  const gen = O.generatedAt || '未生成';
  document.getElementById('subline').textContent = '最后同步 ' + gen;
  document.getElementById('sideFoot').innerHTML =
    `数据快照 <b>${esc(gen)}</b><br>运行 <b>node probe.mjs</b> 刷新`;
}

function render(){
  renderMembers(); renderKpis(); renderWorkspace(); renderRoutes(); renderFeed(); renderChrome();
}
function all(){ return true; }

document.getElementById('q').addEventListener('input', e => {
  filter = e.target.value.trim().toLowerCase();
  renderFeed();
});

render();
</script>
</body>
</html>
